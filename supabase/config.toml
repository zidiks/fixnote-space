# Supabase CLI config. Local stack: `supabase start`.
# Push auth settings and templates to the hosted project: `supabase config push`.
project_id = "nsteehqbmljuczxgkvae"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
# Local email catcher: http://localhost:54324
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://tauri.localhost", "tauri://localhost"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
email_sent = 30
token_verifications = 30

# Passwordless: email + 6-digit code. See docs/CONCEPT.md section 6.3.
[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false
max_frequency = "30s"
otp_length = 6
otp_expiry = 600

# New users get the "confirmation" email, returning users the "magic_link" one.
# Both carry the same code; language comes from user metadata `lang` (en | es | ru).
[auth.email.template.confirmation]
subject = "FixNote code / Código / Код"
content_path = "./supabase/templates/otp.html"

[auth.email.template.magic_link]
subject = "FixNote code / Código / Код"
content_path = "./supabase/templates/otp.html"

[auth.external.apple]
enabled = false

[auth.external.google]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[analytics]
enabled = false
