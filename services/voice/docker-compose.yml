# The voice server behind Caddy (HTTPS with an automatic certificate for VOICE_DOMAIN).
services:
  voice:
    build:
      context: .
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    env_file: .env
    restart: unless-stopped
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - voice
    ports:
      - "80:80"
      - "443:443"
    environment:
      VOICE_DOMAIN: ${VOICE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
