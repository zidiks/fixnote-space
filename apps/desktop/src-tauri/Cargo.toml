[package]
name = "fixnote-desktop"
version = "0.0.0"
description = "FixNote desktop app"
edition = "2021"
rust-version = "1.85"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "fixnote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The tray icon (src/tray.rs); PNG for its macOS template image.
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bundled SQLite (with FTS5) so every OS runs the same engine as the web build.
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-dialog = "2"
# Opens links in the system browser.
tauri-plugin-opener = "2"
percent-encoding = "2"
# Link cards: fetch a page's <head>. System TLS (SChannel on Windows), no C toolchain needed.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "system-proxy"] }
# Streaming LLM requests for the webview (see src/http.rs).
tokio = { version = "1", features = ["sync", "macros"] }
base64 = "0.22"
# Codex keeps its MCP servers in TOML; edited in place, comments and layout kept.
toml_edit = "0.25"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# OS credential store for the recovery secret: Credential Manager, Keychain, kernel keyring.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
# Direct WebView2 access to switch off browser shortcuts (print, find, reload, zoom).
webview2-com = "0.38"
windows-core = "0.61"
# Whether the app runs from its MSIX package (the Microsoft Store build, see src/store.rs).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx"] }
# Call notes: records what the computer plays (WASAPI loopback, see src/system_audio.rs).
cpal = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
# Call notes: the Core Audio tap for what the Mac plays (src/system_audio.rs). Already in the
# dependency tree through Tauri.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSValue"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

# Auto-update from signed GitHub releases (see README → Releases); system TLS like reqwest above.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
