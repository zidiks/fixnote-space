[package]
name = "fixnote-desktop"
version = "0.0.0"
description = "FixNote desktop app"
edition = "2021"
rust-version = "1.80"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "fixnote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
