name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, test, build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build config (repo variables over .env.example)
        shell: bash
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          BOT: ${{ vars.VITE_TELEGRAM_BOT }}
          WEB: ${{ vars.VITE_WEB_URL }}
          VOICE: ${{ vars.VITE_VOICE_URL }}
        # .env.example has the public defaults; each repository variable that is set replaces its
        # line (before, the bot name was dropped whenever the Supabase pair was not set).
        run: |
          cp .env.example .env
          put() {
            [ -n "$2" ] || return 0
            grep -v "^$1=" .env > .env.next || true
            printf '%s=%s\n' "$1" "$2" >> .env.next
            mv .env.next .env
          }
          # The project URL and key only as a pair, so they never point at two different projects.
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            put VITE_SUPABASE_URL "$URL"
            put VITE_SUPABASE_ANON_KEY "$KEY"
          fi
          put VITE_TELEGRAM_BOT "$BOT"
          put VITE_WEB_URL "$WEB"
          put VITE_VOICE_URL "$VOICE"
          grep -o '^VITE_[A-Z_]*=' .env | tr '\n' ' '
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @fixnote/web build
      - run: pnpm --filter @fixnote/landing build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 14

  functions:
    name: Edge function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Each function has its own Deno config (deno.json); run from its folder so Deno uses it
      # instead of the repository's package.json.
      - name: deno test (each function)
        shell: bash
        run: |
          set -e
          for dir in supabase/functions/*/; do
            if compgen -G "${dir}*.test.ts" > /dev/null; then
              echo "::group::${dir}"
              (cd "$dir" && deno test --allow-net --allow-env)
              echo "::endgroup::"
            fi
          done

  rust:
    name: Rust clippy (desktop shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Placeholder frontend for generate_context!
        run: mkdir -p apps/web/dist && echo '<!doctype html>' > apps/web/dist/index.html
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
