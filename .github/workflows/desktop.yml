name: Desktop build

# Windows installers (NSIS, MSI) and macOS disk images (Apple Silicon and Intel). Runs on main, on `v*`
# tags, on demand, and on any branch whose pushed commit message contains "[build desktop]".
# A `v*` tag also publishes a GitHub release whose files have stable names, which the site's
# /download/* links point at (apps/landing/public/_redirects). With the update signing key set up
# (secret TAURI_SIGNING_PRIVATE_KEY, variable TAURI_UPDATER_PUBKEY; see README → Releases), the
# release also carries signed update files and latest.json, from which installed apps update.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          # macOS: Apple Silicon (arm64) and Intel (x86_64), each built natively, so the MCP
          # sidecar matches the app. Ad-hoc signed, not notarized: see README.
          - os: macos-latest
            bundles: app,dmg
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz*
          - os: macos-15-intel
            bundles: app,dmg
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz*
    name: Build (${{ matrix.os }})
    if: >-
      github.event_name != 'push' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[build desktop]')
    runs-on: ${{ matrix.os }}
    # Per job, so a push that builds nothing does not cancel a running build.
    concurrency:
      group: desktop-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Supabase config (repo variables, else .env.example)
        shell: bash
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          BOT: ${{ vars.VITE_TELEGRAM_BOT }}
          WEB: ${{ vars.VITE_WEB_URL }}
        run: |
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\nVITE_TELEGRAM_BOT=%s\nVITE_WEB_URL=%s\n' "$URL" "$KEY" "$BOT" "$WEB" > .env
          else
            cp .env.example .env
          fi
      - name: MCP server (single executable, bundled with the app)
        run: pnpm --filter @fixnote/mcp build:sea
      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          # With the signing key: signed update files, and the public key the app checks them with.
          args=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$PUBKEY" ]; then
            node -e 'console.log(JSON.stringify({bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: process.env.PUBKEY}}}))' > "$RUNNER_TEMP/updater.json"
            args=(--config "$RUNNER_TEMP/updater.json")
          else
            echo "::notice::no update signing key: this build cannot update itself"
          fi
          pnpm --filter @fixnote/desktop tauri build --bundles ${{ matrix.bundles }} "${args[@]}"
      - name: App checks (MCP server runs as bundled, microphone prompt)
        shell: bash
        run: |
          set -e
          node apps/mcp/scripts/smoke.mjs apps/desktop/src-tauri/binaries/fixnote-mcp-*
          if [ "$RUNNER_OS" = macOS ]; then
            # Without this key macOS never asks for the microphone and dictation gets "not allowed".
            plutil -p apps/desktop/src-tauri/target/release/bundle/macos/FixNote.app/Contents/Info.plist | grep NSMicrophoneUsageDescription
            BIN=apps/desktop/src-tauri/target/release/bundle/macos/FixNote.app/Contents/MacOS/fixnote-mcp
            codesign -dv --entitlements - "$BIN" 2>&1 || true
            node apps/mcp/scripts/smoke.mjs "$BIN"
            # The check itself must catch the failure it guards against: the same binary signed
            # with hardened runtime and no JIT entitlement has to fail it.
            cp "$BIN" "$RUNNER_TEMP/fixnote-mcp-hardened"
            codesign --force --sign - --options runtime "$RUNNER_TEMP/fixnote-mcp-hardened"
            if node apps/mcp/scripts/smoke.mjs "$RUNNER_TEMP/fixnote-mcp-hardened"; then
              echo "::warning::the hardened-runtime copy did not crash; the JIT check proves nothing here"
            else
              echo "hardened-runtime copy fails as expected"
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fixnote-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stable file names
        shell: bash
        run: |
          set -e
          mkdir release
          one() { # exactly one file matches, so a missing or extra installer fails the release
            local files=("$@")
            [ "${#files[@]}" -eq 1 ] && [ -f "${files[0]}" ] || { echo "::error::expected one file, got: ${files[*]}" >&2; exit 1; }
            echo "${files[0]}"
          }
          shopt -s globstar nullglob
          cp "$(one artifacts/fixnote-windows-latest/**/*.exe)" release/FixNote-Windows-x64-setup.exe
          # One MSI per installer language (FixNote_<version>_x64_<lang>.msi).
          msis=(artifacts/fixnote-windows-latest/**/*.msi)
          [ "${#msis[@]}" -gt 0 ] || { echo "::error::no MSI installers" >&2; exit 1; }
          for msi in "${msis[@]}"; do
            lang=$(basename "$msi" .msi); lang=${lang##*_}
            cp "$msi" "release/FixNote-Windows-x64-$lang.msi"
          done
          cp "$(one artifacts/fixnote-macos-latest/**/*.dmg)" release/FixNote-macOS-arm64.dmg
          cp "$(one artifacts/fixnote-macos-15-intel/**/*.dmg)" release/FixNote-macOS-x64.dmg
          # Update files (signed builds only): the app bundles for macOS, and latest.json that
          # installed apps read (via fixnote.space/download/latest.json).
          sigs=(artifacts/**/*.sig)
          if [ "${#sigs[@]}" -gt 0 ]; then
            cp "$(one artifacts/fixnote-macos-latest/**/*.app.tar.gz)" release/FixNote-macOS-arm64.app.tar.gz
            cp "$(one artifacts/fixnote-macos-15-intel/**/*.app.tar.gz)" release/FixNote-macOS-x64.app.tar.gz
            WIN_SIG="$(one artifacts/fixnote-windows-latest/**/*.exe.sig)" \
            ARM_SIG="$(one artifacts/fixnote-macos-latest/**/*.app.tar.gz.sig)" \
            X64_SIG="$(one artifacts/fixnote-macos-15-intel/**/*.app.tar.gz.sig)" \
            node -e '
              const fs = require("node:fs")
              const tag = process.env.GITHUB_REF_NAME
              const url = (name) => `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/${name}`
              const entry = (sig, name) => ({ signature: fs.readFileSync(sig, "utf8").trim(), url: url(name) })
              const manifest = {
                version: tag.replace(/^v/, ""),
                notes: "",
                pub_date: new Date().toISOString(),
                platforms: {
                  "windows-x86_64": entry(process.env.WIN_SIG, "FixNote-Windows-x64-setup.exe"),
                  "darwin-aarch64": entry(process.env.ARM_SIG, "FixNote-macOS-arm64.app.tar.gz"),
                  "darwin-x86_64": entry(process.env.X64_SIG, "FixNote-macOS-x64.app.tar.gz"),
                },
              }
              fs.writeFileSync("release/latest.json", JSON.stringify(manifest, null, 2))
            '
            cat release/latest.json
          else
            echo "::notice::unsigned build: no latest.json, installed apps will not see this release"
          fi
          ls -l release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY" --title "FixNote ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
