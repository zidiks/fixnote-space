name: Desktop build

# Windows first. Add `macos-latest` (and `--target universal-apple-darwin`) to the matrix when needed.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Supabase config (repo variables, else .env.example)
        shell: bash
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          BOT: ${{ vars.VITE_TELEGRAM_BOT }}
        run: |
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\nVITE_TELEGRAM_BOT=%s\n' "$URL" "$KEY" "$BOT" > .env
          else
            cp .env.example .env
          fi
      - name: MCP server (single executable, bundled with the app)
        run: pnpm --filter @fixnote/mcp build:sea
      - name: Build installers
        run: pnpm --filter @fixnote/desktop tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: fixnote-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
