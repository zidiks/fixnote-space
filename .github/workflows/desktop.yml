name: Desktop build

# Windows installers (NSIS, MSI) and macOS disk images (Apple Silicon and Intel). Runs on main, on `v*`
# tags, on demand, and on any branch whose pushed commit message contains "[build desktop]".
# A release (Run workflow on main with "release" set, or a pushed `v*` tag) also publishes a GitHub
# release whose files have stable names, which the site's /download/* links point at
# (apps/landing/public/_redirects). The version comes from the tag: Run workflow picks the next one
# after the latest `v*` tag and stamps it into the build, so no file needs a version bump. With the update signing key set up
# (secret TAURI_SIGNING_PRIVATE_KEY, variable TAURI_UPDATER_PUBKEY; see README → Releases), the
# release also carries signed update files and latest.json, from which installed apps update.
# Windows code signing (Azure Artifact Signing, so SmartScreen and Windows trust the installers):
# on when the secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and the variables
# AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE are set (README → Releases);
# without them the Windows build is unsigned as before.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release: the next version after the latest v* tag (main only)'
        type: choice
        options: [patch, minor, major, none]
        default: patch

jobs:
  version:
    name: Version
    if: >-
      github.event_name != 'push' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[build desktop]')
    runs-on: ubuntu-latest
    outputs:
      # vX.Y.Z when this run publishes a release, else empty.
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        shell: bash
        env:
          BUMP: ${{ inputs.release }}
        run: |
          set -euo pipefail
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=$GITHUB_REF_NAME
            [[ "$tag" =~ $semver ]] || { echo "::error::tag $tag is not vX.Y.Z"; exit 1; }
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "${BUMP:-none}" != none ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::releases are made from main"; exit 1; }
            latest=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | { grep -E "$semver" || true; } | sort -V | tail -n1)
            IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
            major=${major#v}
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *) patch=$((patch + 1)) ;;
            esac
            tag="v$major.$minor.$patch"
            echo "latest ${latest:-none} -> $tag"
          else
            tag=
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [ -z "$tag" ] || echo "::notice::releasing $tag"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          # macOS: Apple Silicon (arm64) and Intel (x86_64), each built natively, so the MCP
          # sidecar matches the app. Ad-hoc signed, not notarized: see README.
          - os: macos-latest
            bundles: app,dmg
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz*
          - os: macos-15-intel
            bundles: app,dmg
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz*
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Per job, so a push that builds nothing does not cancel a running build; a release build is
    # never cancelled by the next push to main.
    concurrency:
      group: desktop-${{ github.ref }}-${{ needs.version.outputs.tag }}-${{ matrix.os }}
      cancel-in-progress: ${{ needs.version.outputs.tag == '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Stamp the release version (app and MCP server)
        if: needs.version.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          node -e '
            const fs = require("node:fs")
            const version = process.env.TAG.replace(/^v/, "")
            const conf = "apps/desktop/src-tauri/tauri.conf.json"
            const json = JSON.parse(fs.readFileSync(conf, "utf8"))
            json.version = version
            fs.writeFileSync(conf, `${JSON.stringify(json, null, 2)}\n`)
            const mcp = "apps/mcp/src/server.ts"
            const src = fs.readFileSync(mcp, "utf8")
            if (!/export const VERSION = /.test(src)) throw new Error(`VERSION not found in ${mcp}`)
            fs.writeFileSync(mcp, src.replace(/export const VERSION = .*/, `export const VERSION = ${JSON.stringify(version)}`))
            console.log("version", version)
          '
      - name: Build config (repo variables over .env.example)
        shell: bash
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          BOT: ${{ vars.VITE_TELEGRAM_BOT }}
          WEB: ${{ vars.VITE_WEB_URL }}
        # .env.example has the public defaults; each repository variable that is set replaces its
        # line (before, the bot name was dropped whenever the Supabase pair was not set).
        run: |
          cp .env.example .env
          put() {
            [ -n "$2" ] || return 0
            grep -v "^$1=" .env > .env.next || true
            printf '%s=%s\n' "$1" "$2" >> .env.next
            mv .env.next .env
          }
          # The project URL and key only as a pair, so they never point at two different projects.
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            put VITE_SUPABASE_URL "$URL"
            put VITE_SUPABASE_ANON_KEY "$KEY"
          fi
          put VITE_TELEGRAM_BOT "$BOT"
          put VITE_WEB_URL "$WEB"
          grep -o '^VITE_[A-Z_]*=' .env | tr '\n' ' '
      - name: MCP server (single executable, bundled with the app)
        run: pnpm --filter @fixnote/mcp build:sea
      - name: Windows code signing (Azure Artifact Signing)
        id: winsign
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        # Tauri runs the sign command for every file it ships (the app, the MCP server, the
        # installers), so what is inside an installer is signed too, and the update files are made
        # from the signed installers.
        run: |
          if [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_CLIENT_SECRET" ] ||
             [ -z "$ENDPOINT" ] || [ -z "$ACCOUNT" ] || [ -z "$PROFILE" ]; then
            echo "::notice::no Azure signing set up: the Windows build is not code signed"
            echo "on=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo install artifact-signing-cli --locked
          node -e '
            const cmd = `artifact-signing-cli -e ${process.env.ENDPOINT} -a ${process.env.ACCOUNT} -c ${process.env.PROFILE} -d FixNote %1`
            console.log(JSON.stringify({ bundle: { windows: { signCommand: cmd } } }))
          ' > "$RUNNER_TEMP/winsign.json"
          echo "on=1" >> "$GITHUB_OUTPUT"
      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          # For the Windows sign command (read by artifact-signing-cli).
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINSIGN: ${{ steps.winsign.outputs.on }}
        run: |
          # With the signing key: signed update files, and the public key the app checks them with.
          args=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$PUBKEY" ]; then
            node -e 'console.log(JSON.stringify({bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: process.env.PUBKEY}}}))' > "$RUNNER_TEMP/updater.json"
            args=(--config "$RUNNER_TEMP/updater.json")
          else
            echo "::notice::no update signing key: this build cannot update itself"
          fi
          if [ -n "$WINSIGN" ]; then args+=(--config "$RUNNER_TEMP/winsign.json"); fi
          pnpm --filter @fixnote/desktop tauri build --bundles ${{ matrix.bundles }} "${args[@]}"
      - name: Windows signatures are valid
        if: runner.os == 'Windows' && steps.winsign.outputs.on != ''
        shell: pwsh
        run: |
          # The app and the MCP server as built, and the installers.
          $files = (Get-ChildItem apps/desktop/src-tauri/target/release/*.exe).FullName `
            + (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe).FullName `
            + (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi/*.msi).FullName
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$($sig.Status)  $($sig.SignerCertificate.Subject)  $f"
            if ($sig.Status -ne 'Valid') { $bad++ }
          }
          if ($bad) { throw "$bad file(s) are not signed" }
      - name: App checks (MCP server runs as bundled, microphone prompt)
        shell: bash
        run: |
          set -e
          node apps/mcp/scripts/smoke.mjs apps/desktop/src-tauri/binaries/fixnote-mcp-*
          if [ "$RUNNER_OS" = macOS ]; then
            # Without this key macOS never asks for the microphone and dictation gets "not allowed".
            plutil -p apps/desktop/src-tauri/target/release/bundle/macos/FixNote.app/Contents/Info.plist | grep NSMicrophoneUsageDescription
            BIN=apps/desktop/src-tauri/target/release/bundle/macos/FixNote.app/Contents/MacOS/fixnote-mcp
            codesign -dv --entitlements - "$BIN" 2>&1 || true
            node apps/mcp/scripts/smoke.mjs "$BIN"
            # The check itself must catch the failure it guards against: the same binary signed
            # with hardened runtime and no JIT entitlement has to fail it.
            cp "$BIN" "$RUNNER_TEMP/fixnote-mcp-hardened"
            codesign --force --sign - --options runtime "$RUNNER_TEMP/fixnote-mcp-hardened"
            if node apps/mcp/scripts/smoke.mjs "$RUNNER_TEMP/fixnote-mcp-hardened"; then
              echo "::warning::the hardened-runtime copy did not crash; the JIT check proves nothing here"
            else
              echo "hardened-runtime copy fails as expected"
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fixnote-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stable file names
        shell: bash
        run: |
          set -e
          mkdir release
          one() { # exactly one file matches, so a missing or extra installer fails the release
            local files=("$@")
            [ "${#files[@]}" -eq 1 ] && [ -f "${files[0]}" ] || { echo "::error::expected one file, got: ${files[*]}" >&2; exit 1; }
            echo "${files[0]}"
          }
          shopt -s globstar nullglob
          cp "$(one artifacts/fixnote-windows-latest/**/*.exe)" release/FixNote-Windows-x64-setup.exe
          # One MSI per installer language (FixNote_<version>_x64_<lang>.msi).
          msis=(artifacts/fixnote-windows-latest/**/*.msi)
          [ "${#msis[@]}" -gt 0 ] || { echo "::error::no MSI installers" >&2; exit 1; }
          for msi in "${msis[@]}"; do
            lang=$(basename "$msi" .msi); lang=${lang##*_}
            cp "$msi" "release/FixNote-Windows-x64-$lang.msi"
          done
          cp "$(one artifacts/fixnote-macos-latest/**/*.dmg)" release/FixNote-macOS-arm64.dmg
          cp "$(one artifacts/fixnote-macos-15-intel/**/*.dmg)" release/FixNote-macOS-x64.dmg
          # Update files (signed builds only): the app bundles for macOS, and latest.json that
          # installed apps read (via fixnote.space/download/latest.json).
          sigs=(artifacts/**/*.sig)
          if [ "${#sigs[@]}" -gt 0 ]; then
            cp "$(one artifacts/fixnote-macos-latest/**/*.app.tar.gz)" release/FixNote-macOS-arm64.app.tar.gz
            cp "$(one artifacts/fixnote-macos-15-intel/**/*.app.tar.gz)" release/FixNote-macOS-x64.app.tar.gz
            WIN_SIG="$(one artifacts/fixnote-windows-latest/**/*.exe.sig)" \
            ARM_SIG="$(one artifacts/fixnote-macos-latest/**/*.app.tar.gz.sig)" \
            X64_SIG="$(one artifacts/fixnote-macos-15-intel/**/*.app.tar.gz.sig)" \
            node -e '
              const fs = require("node:fs")
              const tag = process.env.TAG
              const url = (name) => `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/${name}`
              const entry = (sig, name) => ({ signature: fs.readFileSync(sig, "utf8").trim(), url: url(name) })
              const manifest = {
                version: tag.replace(/^v/, ""),
                notes: "",
                pub_date: new Date().toISOString(),
                platforms: {
                  "windows-x86_64": entry(process.env.WIN_SIG, "FixNote-Windows-x64-setup.exe"),
                  "darwin-aarch64": entry(process.env.ARM_SIG, "FixNote-macOS-arm64.app.tar.gz"),
                  "darwin-x86_64": entry(process.env.X64_SIG, "FixNote-macOS-x64.app.tar.gz"),
                },
              }
              fs.writeFileSync("release/latest.json", JSON.stringify(manifest, null, 2))
            '
            cat release/latest.json
          else
            echo "::notice::unsigned build: no latest.json, installed apps will not see this release"
          fi
          ls -l release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Makes the tag on the built commit when it does not exist yet (a release from Run workflow).
        run: >-
          gh release create "$TAG" release/*
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FixNote ${TAG#v}" --generate-notes
