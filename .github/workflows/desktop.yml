name: Desktop build

# Windows installers (NSIS, MSI) and a macOS disk image (Apple Silicon). Runs on main, on `v*`
# tags, on demand, and on any branch whose pushed commit message contains "[build desktop]".
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          # Apple Silicon (arm64). Ad-hoc signed, not notarized: see README.
          - os: macos-latest
            bundles: app,dmg
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
    name: Build (${{ matrix.os }})
    if: >-
      github.event_name != 'push' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[build desktop]')
    runs-on: ${{ matrix.os }}
    # Per job, so a push that builds nothing does not cancel a running build.
    concurrency:
      group: desktop-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Supabase config (repo variables, else .env.example)
        shell: bash
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          BOT: ${{ vars.VITE_TELEGRAM_BOT }}
          WEB: ${{ vars.VITE_WEB_URL }}
        run: |
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\nVITE_TELEGRAM_BOT=%s\nVITE_WEB_URL=%s\n' "$URL" "$KEY" "$BOT" "$WEB" > .env
          else
            cp .env.example .env
          fi
      - name: MCP server (single executable, bundled with the app)
        run: pnpm --filter @fixnote/mcp build:sea
      - name: Build installers
        run: pnpm --filter @fixnote/desktop tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: fixnote-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14
