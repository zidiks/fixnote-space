<title>FixNote · logo motion</title>
<style>
  :root { --bg: #f8f5f0; --ink: #000; --muted: #8a857c; --line: #e4dfd6; --fx-k: 1; }
  :root[data-theme="dark"] { --bg: #141312; --ink: #f8f5f0; --muted: #8a857c; --line: #2a2826; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  .stage { display: grid; place-items: center; height: 360px; border: 1px solid var(--line); border-radius: 16px; }
  .stage .fx-logo { width: min(80%, 620px); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 32px; }
  button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 32px 0 12px; }
  .row { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .row img { display: block; }
  :root[data-theme="dark"] .row img { filter: invert(1); }
  .inline { display: inline-flex; overflow: hidden; height: 28px; width: 36.089px; transition: width calc(var(--fx-k) * .9s) cubic-bezier(.6, 0, .2, 1); cursor: pointer; }
  .inline.open { width: 107.059px; }
  .inline .fx-logo { height: 28px; width: __WORD_W__px; flex: none; }

  .stage .fx-logo { --fx-shift: 240.327px; }
</style>
<style>
/*
 * FixNote logo motion (brand/README.md). The shapes are never redrawn: each stroke of the pen is a
 * mask that opens the ink under it. `data-phase` on the svg says what is on screen:
 *   none → draw → mark     the mark writes itself
 *   mark → expand → word   its tail goes back into the f and the word is written
 *   word → collapse → mark the word is unwritten from its end and the tail grows again
 * --fx-k stretches time (2 = half speed), --fx-shift moves the mark to the middle of the word's
 * box while only the mark shows (centered use).
 */
.fx-logo-box {
  display: inline-block;
  flex: none;
  overflow: hidden;
  vertical-align: middle;
  transition: width calc(var(--fx-k, 1) * 0.9s) cubic-bezier(0.6, 0, 0.2, 1);
}

.fx-logo {
  display: block;
  overflow: visible;
  fill: currentColor;
}

/* --o is where a stroke starts on its line, so the pieces of one line move as one. */
.fx-logo [data-m] {
  --on: calc(var(--o, 0) * 1px);
  --off: calc(1px + var(--o, 0) * 1px);
  fill: none;
  stroke: #fff;
  stroke-dasharray: 1 2;
  stroke-dashoffset: var(--on);
}
.fx-logo :is([data-m="ta"], [data-m="tb"]) {
  stroke-dashoffset: var(--off);
}
.fx-logo [data-s="dot"] {
  transform-box: fill-box;
  transform-origin: center;
}

.fx-logo:is([data-phase="none"], [data-phase="draw"], [data-phase="mark"]) [data-s="dot"] {
  opacity: 0;
}
.fx-logo:is([data-phase="none"], [data-phase="draw"], [data-phase="mark"]) [data-m^="w-"] {
  stroke-dashoffset: var(--off);
}
.fx-logo:is([data-phase="none"], [data-phase="draw"], [data-phase="mark"]) [data-s="lockup"] {
  transform: translateX(var(--fx-shift, 0px));
}
.fx-logo:is([data-phase="draw"], [data-phase="mark"]) :is([data-m="ta"], [data-m="tb"]) {
  stroke-dashoffset: var(--on);
}
.fx-logo[data-phase="none"] :is([data-m="mk-f"], [data-m="t0"]) {
  stroke-dashoffset: var(--off);
}

/* 1. The mark writes itself. */
.fx-logo[data-phase="draw"] [data-m="mk-f"] {
  animation: fx-logo-draw calc(var(--fx-k, 1) * 0.42s) cubic-bezier(0.5, 0, 0.3, 1) both;
}
.fx-logo[data-phase="draw"] :is([data-m="t0"], [data-m="ta"], [data-m="tb"]) {
  animation: fx-logo-draw calc(var(--fx-k, 1) * 0.95s) cubic-bezier(0.55, 0, 0.2, 1)
    calc(var(--fx-k, 1) * 0.28s) both;
}

/* 2. The tail goes back into the f and the word is written; the f never moves. */
.fx-logo[data-phase="expand"] [data-s="lockup"] {
  animation: fx-logo-shift calc(var(--fx-k, 1) * 1.3s) cubic-bezier(0.6, 0, 0.2, 1) both;
}
.fx-logo[data-phase="expand"] :is([data-m="ta"], [data-m="tb"]) {
  animation: fx-logo-retract calc(var(--fx-k, 1) * 0.5s) cubic-bezier(0.6, 0, 0.4, 1) both;
}
.fx-logo[data-phase="expand"] [data-m="w-i"] {
  animation: fx-logo-draw calc(var(--fx-k, 1) * 0.36s) cubic-bezier(0.5, 0, 0.3, 1)
    calc(var(--fx-k, 1) * 0.3s) both;
}
.fx-logo[data-phase="expand"] [data-s="dot"] {
  animation: fx-logo-pop calc(var(--fx-k, 1) * 0.3s) cubic-bezier(0.3, 0, 0.3, 1)
    calc(var(--fx-k, 1) * 0.5s) both;
}
.fx-logo[data-phase="expand"] :is([data-m="w-x1"], [data-m="w-x2"]) {
  animation: fx-logo-draw calc(var(--fx-k, 1) * 0.62s) cubic-bezier(0.45, 0, 0.3, 1)
    calc(var(--fx-k, 1) * 0.5s) both;
}
.fx-logo[data-phase="expand"] [data-m="w-t1"] {
  animation: fx-logo-draw calc(var(--fx-k, 1) * 0.2s) cubic-bezier(0.4, 0, 0.4, 1)
    calc(var(--fx-k, 1) * 1s) both;
}
.fx-logo[data-phase="expand"] [data-m="w-t2"] {
  animation: fx-logo-draw calc(var(--fx-k, 1) * 0.3s) cubic-bezier(0.4, 0, 0.3, 1)
    calc(var(--fx-k, 1) * 1.08s) both;
}
.fx-logo[data-phase="expand"] :is([data-m="w-e1"], [data-m="w-e2"]) {
  animation: fx-logo-draw calc(var(--fx-k, 1) * 0.42s) cubic-bezier(0.4, 0, 0.2, 1)
    calc(var(--fx-k, 1) * 1.22s) both;
}

/* 3. The word is unwritten from its end, then the tail grows again. */
.fx-logo[data-phase="collapse"] :is([data-m="w-e1"], [data-m="w-e2"]) {
  animation: fx-logo-draw calc(var(--fx-k, 1) * 0.18s) cubic-bezier(0.4, 0, 0.5, 1) reverse both;
}
.fx-logo[data-phase="collapse"] [data-m="w-t2"] {
  animation: fx-logo-draw calc(var(--fx-k, 1) * 0.14s) linear calc(var(--fx-k, 1) * 0.1s) reverse
    both;
}
.fx-logo[data-phase="collapse"] [data-m="w-t1"] {
  animation: fx-logo-draw calc(var(--fx-k, 1) * 0.1s) linear calc(var(--fx-k, 1) * 0.2s) reverse
    both;
}
.fx-logo[data-phase="collapse"] :is([data-m="w-x1"], [data-m="w-x2"]) {
  animation: fx-logo-draw calc(var(--fx-k, 1) * 0.3s) cubic-bezier(0.4, 0, 0.6, 1)
    calc(var(--fx-k, 1) * 0.24s) reverse both;
}
.fx-logo[data-phase="collapse"] [data-s="dot"] {
  animation: fx-logo-out calc(var(--fx-k, 1) * 0.12s) linear calc(var(--fx-k, 1) * 0.4s) both;
}
.fx-logo[data-phase="collapse"] [data-m="w-i"] {
  animation: fx-logo-draw calc(var(--fx-k, 1) * 0.2s) cubic-bezier(0.4, 0, 0.6, 1)
    calc(var(--fx-k, 1) * 0.44s) reverse both;
}
.fx-logo[data-phase="collapse"] :is([data-m="ta"], [data-m="tb"]) {
  animation: fx-logo-retract calc(var(--fx-k, 1) * 0.6s) cubic-bezier(0.2, 0, 0.45, 1)
    calc(var(--fx-k, 1) * 0.5s) reverse both;
}
.fx-logo[data-phase="collapse"] [data-s="lockup"] {
  animation: fx-logo-shift calc(var(--fx-k, 1) * 0.95s) cubic-bezier(0.6, 0, 0.2, 1)
    calc(var(--fx-k, 1) * 0.2s) reverse both;
}

@keyframes fx-logo-draw {
  from {
    stroke-dashoffset: var(--off);
  }
  to {
    stroke-dashoffset: var(--on);
  }
}
/* --stop: how far the tail goes back, to where it leaves the f. */
@keyframes fx-logo-retract {
  from {
    stroke-dashoffset: var(--on);
  }
  to {
    stroke-dashoffset: calc((var(--o, 0) + var(--stop)) * 1px);
  }
}
@keyframes fx-logo-out {
  from {
    opacity: 1;
  }
  to {
    opacity: 0;
  }
}
@keyframes fx-logo-shift {
  from {
    transform: translateX(var(--fx-shift, 0px));
  }
  to {
    transform: translateX(0);
  }
}
@keyframes fx-logo-pop {
  from {
    opacity: 0;
    transform: scale(0);
  }
  60% {
    opacity: 1;
    transform: scale(1.18);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* No motion: everything lands at once. */
@media (prefers-reduced-motion: reduce) {
  .fx-logo-box,
  .fx-logo {
    --fx-k: 0.001;
  }
}

</style>

  <h2>Статика: биг лого</h2>
  <div class="row">
    <img src="fixnote-wordmark.svg" height="16" alt=""><img src="fixnote-wordmark.svg" height="28" alt="">
    <img src="fixnote-wordmark.svg" height="56" alt="">
  </div>
</main>
<script>
  const root = document.documentElement
  const stage = document.getElementById('stage')
  const k = () => Number(getComputedStyle(root).getPropertyValue('--fx-k'))
  let timer
  function phase(el, name) {
    el.dataset.phase = name === 'draw' || name === 'expand' || name === 'collapse' ? 'none' : name
    if (el.dataset.phase === name) return
    el.getBoundingClientRect()
    el.dataset.phase = name
  }
  function play(name) {
    clearTimeout(timer)
    if (name !== 'intro') return phase(stage, name)
    phase(stage, 'draw')
    timer = setTimeout(() => phase(stage, 'expand'), k() * 1250 + 350)
  }
  for (const b of document.querySelectorAll('[data-play]')) b.onclick = () => play(b.dataset.play)
  document.getElementById('theme').onclick = () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'
  }
  const speeds = [1, 0.5, 4]
  document.getElementById('speed').onclick = (e) => {
    const next = speeds[(speeds.indexOf(1 / k()) + 1) % speeds.length]
    root.style.setProperty('--fx-k', String(1 / next))
    e.currentTarget.textContent = `Скорость: ${next}×`
  }
  const inline = document.getElementById('inline')
  const small = inline.querySelector('.fx-logo')
  small.dataset.phase = 'mark'
  inline.onclick = () => phase(small, inline.classList.toggle('open') ? 'expand' : 'collapse')
  play('intro')
</script>
